verbose = false;

maxthreads = 10;

# Note: order is significant, find() returns the first producer covering the point
producers =
[
        "pal_skandinavia",
        "tutka_suomi_rr",
        "ecmwf_eurooppa_pinta",
        "ecmwf_maailma_piste",
        "ecmwf_skandinavia_painepinta"
];

pal_skandinavia:
{
        alias                   = ["pal","kap"];
        directory               = "/usr/share/smartmet/test/data/pal";
        pattern                 = ".*_pal_skandinavia_pinta\.sqd$";
        forecast                = true;
        type                    = "grid";
        leveltype               = "surface";
        number_to_keep          = 2;
};

tutka_suomi_rr:
{
        alias                   = ["tutka"];
        directory               = "/usr/share/smartmet/test/data/tutka_suomi_rr";
        pattern                 = ".*_tutka_suomi_rr\.sqd$";
        multifile               = true;
        forecast                = false;
        type                    = "grid";
        leveltype               = "surface";
        number_to_keep          = 8;
};

ecmwf_eurooppa_pinta:
{
        alias                   = ["ec","europe"];
        directory               = "/usr/share/smartmet/test/data/ecpinta";
        pattern                 = ".*_ecmwf_eurooppa_pinta\.sqd$";
        forecast                = true;
        type                    = "grid";
        leveltype               = "surface";
        number_to_keep          = 1;
};

ecmwf_maailma_piste:
{
        alias                   = ["ec","world"];
        directory               = "/usr/share/smartmet/test/data/ecpiste";
        pattern                 = ".*_ecmwf_maailma_piste.*\.sqd$";
        forecast                = true;
        type                    = "points";
	maxdistance		= 8.0;
        leveltype               = "surface";
        number_to_keep          = 1;
};

ecmwf_skandinavia_painepinta:
{
        alias                   = ["pressurelevel","ec"];
        directory               = "/usr/share/smartmet/test/data/ecpainepinta";
        pattern                 = ".*_ecmwf_skandinavia_painepinta.*\.sqd$";
        forecast                = true;
        type                    = "grid";
        leveltype               = "pressure";
        number_to_keep          = 1;
};

